# Only github-actions is covered. The bun devDependency @hraness/support-foundation
# is pinned to a github: commit SHA, which Dependabot cannot bump; update it by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
